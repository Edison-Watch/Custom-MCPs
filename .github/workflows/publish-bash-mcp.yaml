name: Publish bash-mcp

# Publishes @sealgate/bash-mcp to npm when a matching tag is pushed.
# Adapted from publish-android-adb-mcp.yaml: servers/bash is a standalone stdio
# package, installed with bun from a committed lockfile (matching servers_ts.yaml).
#
# First-run setup (once):
#   1. Ensure an npm automation token with publish rights to the @sealgate scope
#      is stored as the repository secret NPM_TOKEN.
#
# Release:
#   Bump "version" in servers/bash/package.json, then:
#     git tag bash-mcp-v0.1.0
#     git push origin bash-mcp-v0.1.0
#   (or run this workflow manually via workflow_dispatch to publish the current
#   package.json version).

on:
  push:
    tags:
      - "bash-mcp-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: servers/bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-node is what wires npm auth: registry-url writes an .npmrc that
      # reads NODE_AUTH_TOKEN, so the `npm publish` step below can authenticate.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Frozen lockfile keeps the release build reproducible (the committed
      # bun.lock pins every transitive dependency).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#bash-mcp-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      # `npm publish` runs prepublishOnly (tsc build) before packing, so the
      # published dist is compiled here; no separate build step needed.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
