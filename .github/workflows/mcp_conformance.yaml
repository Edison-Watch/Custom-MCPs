name: MCP Conformance

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  mcp_conformance:
    if: github.event_name == 'pull_request' || github.event.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Python version
        run: echo "PYTHON_VERSION=$(cat .python-version | tr -d '\n')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.13.4/install.sh | sh

      - name: Install dependencies
        run: uv sync

      # Auth uses a seeded API key against a throwaway SQLite DB (see the
      # script); no WorkOS/Stripe/Redis secrets are required for conformance.
      - name: Run MCPJam conformance
        run: uv run python scripts/mcp_conformance.py

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-conformance-reports
          path: mcp_conformance_results/
          if-no-files-found: ignore
