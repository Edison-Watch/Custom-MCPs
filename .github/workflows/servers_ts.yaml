name: TS Fleet Servers

on:
  push:
    branches:
      - '**'
    paths:
      - 'servers/**'
      - 'shared/**'
      - '.github/workflows/servers_ts.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'servers/**'
      - 'shared/**'
      - '.github/workflows/servers_ts.yaml'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.server }} (typecheck + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - image-host
          - reddit
          - youtube
          - x-scraper
          - linkedin-scraper
          - telegram-bot
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Unit tests (offline pure logic)
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Integration tests (workerd + real R2/DO bindings)
        run: bun run test:integration

  # stdio servers are npm-published local processes (no Cloudflare Worker,
  # no workerd integration). They build with tsc and unit-test with vitest,
  # so they get their own job instead of the Worker matrix above.
  test-stdio:
    name: ${{ matrix.server }} (stdio · typecheck + test + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - adb
          - bash
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Unit tests (offline pure logic)
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build (tsc -> dist)
        run: bun run build
